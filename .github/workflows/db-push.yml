name: DB push (prod)

# Production migrations require an explicit owner dispatch.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: production-database
  queue: max
  cancel-in-progress: false

jobs:
  push:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Apply migrations and check security
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx --no-install supabase db push
          npx --no-install supabase db advisors --linked --type security --fail-on warn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
